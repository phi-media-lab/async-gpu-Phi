    "One shared Priority/task context propagates spawn → wake/requeue → hostcall request → host completion without legacy API regression",
    "Low saturation cannot consume High executor slots or explicitly reserved High hostcall credits; bounds are stated in dispatch/service counts, not wall time",
    "Typed waits reject High→Normal/Low and Normal→Low dependencies at compile time, while valid equal/upward waits compile and complete on a real GPU",
    "Stale task/waker generations cannot wake or join a recycled slot; cancellation and shutdown reach one observable terminal state",
    "Multi-warp adversarial stress shows weighted High service and eventual Low progress under a documented bounded-poll assumption",
    "Fresh hazard uses the fresh GPU result; stale/deadline paths discard it and emit watchdog_conservative_stop, with no hard-real-time or actuator-control claim",
]
litmus_test = "A typed Low-saturated GPU workload injects a High task whose metadata crosses an opt-in-reserved hostcall and returns to the same logical task context; High is admitted and serviced at the specified cooperative boundary, Low finishes, invalid downward waits fail compilation, and stale/deadline fault injection never consumes the stale GPU result."

