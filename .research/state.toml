key_insight = "The foundation exists: BlockScope/GridScope already return lifetime-bounded refs from distinct address spaces, but both are plain &'scope mut [T]. The type system can't distinguish them. Introducing SharedRef<'block, T>/GlobalRef<'grid, T> phantom-typed wrappers makes the borrow checker enforce memory hierarchy rules at zero runtime cost — and guides LLVM to emit address-space-specific loads/stores."

